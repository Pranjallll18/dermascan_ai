<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP — DermaScan AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style/style.css">
    <style>
        .verify-wrapper { max-width: 460px; width: 100%; }
        .verify-card { padding: 44px 36px; }

        .shield-icon {
            width: 76px; height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: var(--glow-md);
        }
        .shield-icon i { font-size: 1.8rem; color: white; }

        .verify-title { font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
        .verify-sub { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 4px; }

        .email-highlight {
            display: block;
            text-align: center;
            font-weight: 700;
            color: var(--crimson-light);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .timer-bar {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 18px;
        }
        .timer-bar span { color: var(--crimson-light); font-weight: 700; font-family: 'Courier New', monospace; }
        .timer-bar.expired span { color: var(--danger); }

        .bottom-links {
            display: flex;
            justify-content: space-between;
            margin-top: 22px;
        }
        .bottom-links a {
            font-size: 0.85rem;
            font-weight: 500;
            display: flex; align-items: center; gap: 5px;
            color: var(--text-muted);
        }
        .bottom-links a:hover { color: var(--crimson-light); }

        @media (max-width: 480px) {
            .verify-card { padding: 30px 22px; }
            .verify-title { font-size: 1.35rem; }
            .bottom-links { flex-direction: column; gap: 12px; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh">
        <div class="blob3"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="page-center">
        <div class="verify-wrapper anim-fade-up">
            <div class="glass verify-card">
                <div class="shield-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>

                <h1 class="verify-title text-gradient">Verify Your Email</h1>
                <p class="verify-sub">Enter the 6-digit code sent to</p>
                <span class="email-highlight">{{ email }}</span>

                {% if error %}
                <div class="alert alert-error anim-shake">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" id="otpForm">
                    <input type="hidden" name="otp" id="otpHidden">

                    <div class="otp-group">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="0" autofocus>
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="verifyBtn" disabled>
                        <i class="fas fa-check-circle"></i>
                        <span>Verify & Login</span>
                    </button>
                </form>

                <div class="timer-bar" id="timerBar">
                    Code expires in <span id="countdown">5:00</span>
                </div>

                <div class="bottom-links">
                    <a href="/resend-otp"><i class="fas fa-rotate-right"></i> Resend Code</a>
                    <a href="/login"><i class="fas fa-arrow-left"></i> Change Email</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const boxes = document.querySelectorAll('.otp-box');
        const hidden = document.getElementById('otpHidden');
        const verifyBtn = document.getElementById('verifyBtn');
        const form = document.getElementById('otpForm');

        function sync() {
            let v = '';
            boxes.forEach(b => { v += b.value; });
            hidden.value = v;
            verifyBtn.disabled = v.length < 6;
            boxes.forEach(b => b.classList.toggle('filled', b.value.length > 0));
            if (v.length === 6) setTimeout(() => form.submit(), 250);
        }

        boxes.forEach((box, i) => {
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '').charAt(0) || '';
                sync();
                if (box.value && i < 5) boxes[i + 1].focus();
            });
            box.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !box.value && i > 0) {
                    boxes[i - 1].focus();
                    boxes[i - 1].value = '';
                    sync();
                }
                if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
                if (e.key === 'ArrowRight' && i < 5) boxes[i + 1].focus();
            });
            box.addEventListener('paste', e => {
                e.preventDefault();
                const p = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                p.split('').forEach((ch, j) => { if (boxes[j]) boxes[j].value = ch; });
                sync();
                boxes[Math.min(p.length, 5)].focus();
            });
        });

        /* Countdown */
        let secs = 300;
        const cdEl = document.getElementById('countdown');
        const tBar = document.getElementById('timerBar');
        const tick = setInterval(() => {
            secs--;
            if (secs <= 0) {
                clearInterval(tick);
                tBar.classList.add('expired');
                cdEl.textContent = 'Expired';
                verifyBtn.disabled = true;
                return;
            }
            cdEl.textContent = `${Math.floor(secs / 60)}:${(secs % 60).toString().padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
