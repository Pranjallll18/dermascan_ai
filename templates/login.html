<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DermaScan AI — Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DermaScan AI — AI-powered skin lesion analysis. Log in to scan and analyze skin conditions.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style/style.css">
    <style>
        .login-wrapper { max-width: 440px; width: 100%; }
        .login-card { padding: 44px 36px; }

        .logo-ring {
            width: 88px; height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            box-shadow: var(--glow-md);
            animation: pulse 3s ease-in-out infinite;
            position: relative;
        }
        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(194, 59, 82, 0.2);
            animation: spin 12s linear infinite;
            border-top-color: transparent;
            border-right-color: transparent;
        }
        .logo-ring i { font-size: 2.2rem; color: white; }

        .login-title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 32px;
        }

        .info-strip {
            background: rgba(194, 59, 82, 0.06);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-top: 24px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .info-strip i { color: var(--crimson-light); margin-top: 2px; flex-shrink: 0; }
        .info-strip p { font-size: 0.82rem; color: var(--text-muted); margin: 0; line-height: 1.5; }

        .security-badge {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 24px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .security-badge i { font-size: 0.7rem; color: var(--success); }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
            .login-title { font-size: 1.65rem; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh">
        <div class="blob3"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="page-center">
        <div class="login-wrapper anim-fade-up">
            <div class="glass login-card">
                <!-- Logo -->
                <div class="logo-ring">
                    <i class="fas fa-microscope"></i>
                </div>

                <h1 class="login-title text-gradient">DermaScan AI</h1>
                <p class="login-sub">Enter your email to receive a secure login code</p>

                <!-- Error -->
                {% if error %}
                <div class="alert alert-error anim-shake">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <!-- Form -->
                <form method="POST" id="loginForm">
                    <div class="form-group">
                        <input type="email" name="email" class="form-input" placeholder="you@example.com" required autofocus autocomplete="email">
                        <span class="form-icon"><i class="fas fa-envelope"></i></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                        <i class="fas fa-paper-plane"></i>
                        <span>Send Login Code</span>
                    </button>
                </form>

                <!-- Info -->
                <div class="info-strip">
                    <i class="fas fa-shield-halved"></i>
                    <p>We'll send a <strong>6-digit code</strong> to your email.<br>No password needed — just verify your identity.</p>
                </div>

                <div class="security-badge">
                    <i class="fas fa-circle-check"></i>
                    <span>Passwordless secure authentication</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>Sending…</span>';
            btn.disabled = true;
        });
    </script>
</body>
</html>
